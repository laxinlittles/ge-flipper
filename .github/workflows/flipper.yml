# GE Flipper - runs ge_flipper.py on GitHub's servers and pushes flips to ntfy.
# Save this file in your repo at:  .github/workflows/flipper.yml
#
# How it stays on: each run scans (8am-8pm Eastern) or waits (overnight) for up
# to ~5h40m, then starts the next run itself. GitHub's timer is only a backup
# that restarts the chain if it ever breaks.

name: GE Flipper

on:
  schedule:
    - cron: "17 */3 * * *"    # backup restart every 3 hours
  workflow_dispatch:
    inputs:
      chain:
        description: "Started by the previous run (leave unchecked)"
        type: boolean
        default: false

concurrency:
  group: ge-flipper
  cancel-in-progress: false

permissions:
  actions: write      # lets a run start the next one
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Remembers which items already alerted, so you aren't spammed every run.
      - uses: actions/cache/restore@v4
        with:
          path: ge_alert_history.json
          key: alert-history-${{ github.run_id }}
          restore-keys: alert-history-

      - name: Test notification (manual runs only)
        if: github.event_name == 'workflow_dispatch' && !inputs.chain
        run: |
          curl -s -H "Title: GE Flipper connected" -H "Tags: white_check_mark" \
            -d "Your flipper is running on GitHub. Real alerts will look like a flip with buy/sell/qty/profit." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"

      - name: Scan the GE
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUDGET: ${{ vars.BUDGET || '10000000' }}
          ALERT_PROFIT: ${{ vars.ALERT_PROFIT || '250000' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.chain }}
        run: |
          ARGS="--budget $BUDGET --alert-profit $ALERT_PROFIT"
          ET() { TZ=America/New_York date "$@"; }
          NOW=$(date +%s)
          CAP=$(( NOW + 20400 ))   # stay under GitHub's 6-hour job limit
          HOUR=$(ET +%-H)
          if [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 20 ]; then
            END=$(ET -d "today 20:00" +%s)
            [ "$END" -gt "$CAP" ] && END=$CAP
            echo "Scanning every 2 min until $(ET -d @$END +%H:%M) Eastern."
            timeout $(( END - NOW )) python -u ge_flipper.py --interval 120 $ARGS || true
          else
            if [ "$MANUAL" = "true" ]; then
              echo "Manual run outside 8am-8pm: one scan only."
              python -u ge_flipper.py --once $ARGS
            fi
            if [ "$HOUR" -lt 8 ]; then WAKE=$(ET -d "today 08:00" +%s)
            else WAKE=$(ET -d "tomorrow 08:00" +%s); fi
            [ "$WAKE" -gt "$CAP" ] && WAKE=$CAP
            WAIT=$(( WAKE - $(date +%s) ))
            [ "$WAIT" -lt 0 ] && WAIT=0
            echo "Outside 8am-8pm Eastern. Waiting until $(ET -d @$WAKE +%H:%M) Eastern."
            sleep "$WAIT"
          fi

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ge_alert_history.json
          key: alert-history-${{ github.run_id }}

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run flipper.yml -R "${{ github.repository }}" --ref main -f chain=true
