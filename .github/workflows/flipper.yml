# GE Flipper - runs ge_flipper.py on GitHub's servers and pushes flips to ntfy.
# Save this file in your repo at:  .github/workflows/flipper.yml

name: GE Flipper

on:
  schedule:
    # Hourly starts, roughly 7am-9pm Eastern (UTC hours cover both EDT and EST).
    # A run stays on and scans every 2 min until 8pm Eastern, so a late or
    # skipped start by GitHub doesn't leave gaps. Extra starts wait in line.
    - cron: "3 0,11-23 * * *"
  workflow_dispatch:          # lets you tap "Run workflow" to test it

concurrency:
  group: ge-flipper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Remembers which items already alerted, so you aren't spammed every run.
      - uses: actions/cache/restore@v4
        with:
          path: ge_alert_history.json
          key: alert-history-${{ github.run_id }}
          restore-keys: alert-history-

      - name: Test notification (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -s -H "Title: GE Flipper connected" -H "Tags: white_check_mark" \
            -d "Your flipper is running on GitHub. Real alerts will look like a flip with buy/sell/qty/profit." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"

      - name: Scan the GE
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUDGET: ${{ vars.BUDGET || '10000000' }}
          ALERT_PROFIT: ${{ vars.ALERT_PROFIT || '250000' }}
        run: |
          ARGS="--budget $BUDGET --alert-profit $ALERT_PROFIT"
          HOUR=$(TZ=America/New_York date +%-H)
          if [ "$HOUR" -lt 8 ] || [ "$HOUR" -ge 20 ]; then
            if [ "${{ github.event_name }}" != "schedule" ]; then
              echo "Manual run outside 8am-8pm: one scan only."
              python -u ge_flipper.py --once $ARGS
            else
              echo "Outside 8am-8pm Eastern ($HOUR:00). Skipping scan."
            fi
            exit 0
          fi
          # Scan every 2 min until 8pm Eastern (max ~5h45m per run).
          END=$(TZ=America/New_York date -d "today 20:00" +%s)
          SECS=$(( END - $(date +%s) ))
          [ "$SECS" -gt 20700 ] && SECS=20700
          echo "Scanning every 2 min for $((SECS / 60)) minutes."
          timeout "$SECS" python -u ge_flipper.py --interval 120 $ARGS || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ge_alert_history.json
          key: alert-history-${{ github.run_id }}
